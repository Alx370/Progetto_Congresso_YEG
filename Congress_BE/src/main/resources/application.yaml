spring:
  application:
    name: Congress_BE

  datasource:
    url: "${DB_URL:jdbc:h2:mem:congress}"
    username: "${DB_USERNAME:sa}"
    password: "${DB_PASSWORD:}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  servlet:
    context-path: /api

app:
  import:
    enabled: true
    partecipanti-file: "${IMPORT_PARTECIPANTI_FILE:./dati/partecipanti.csv}"
    interazioni-file: "${IMPORT_INTERAZIONI_FILE:./dati/interazioni.csv}"
